# magi competing on the yukimemi profile repository.
#
# **Only what is peculiar to this checkout lives here.** The roster, the seat
# assignment, the shape of a run and the update policy live at the machine
# layer (`<config_dir>/magi/config.toml`), because none of them are facts about
# this repository.
#
# No `[verify]`: this is the GitHub profile README. Its workflows
# (`cards.yml`, `snake.yml`, `apm-bump.yml`, `kata-apply.yml`) generate assets
# or sync templates; none of them checks a change, so there is no CI to mirror.
#
# Rendered by teravars. Tera braces are live everywhere in this file, but
# comments are stripped before Tera sees them, so a comment may quote
# `{{ ... }}` freely.

[merge]
# Required in every jj-colocated repo: jj keeps git's HEAD detached at the
# working-copy commit, so magi cannot infer the base branch from
# `git symbolic-ref HEAD`.
base = "main"

# Project conventions appended to the node prompts, never merged into them.
# Repository-wide context lives in AGENTS.md, which every agent already reads
# from the checkout.
[prompts]
all = """
This repository uses jj (Jujutsu) with a colocated git repo. `git commit` works \
in a candidate worktree and is what magi expects, but never run `jj` commands \
and never touch the main working copy.
"""
